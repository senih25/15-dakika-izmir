name: Veri veya teknik hata bildirimi
description: Haritada, kaynak bilgisinde veya uygulama davranışında gördüğünüz bir problemi bildirin.
title: "[BİLDİRİM] "
labels:
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Teşekkürler. Kişisel sağlık bilgisi, T.C. kimlik numarası, açık ev adresi veya başka hassas kişisel verileri bu forma yazmayın.
  - type: dropdown
    id: category
    attributes:
      label: Kategori
      options:
        - Nöbetçi eczane
        - Eczane
        - Hastane
        - Afet toplanma alanı
        - Semt pazarı
        - Harita / arayüz
        - Kaynak / lisans
        - Diğer
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Kayıt veya yer adı
      placeholder: Örn. eczane / hastane / pazar / toplanma alanı adı
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Beklenen durum ile gördüğünüz durumu kısa ve somut biçimde yazın.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Varsa resmî kaynak bağlantısı
      placeholder: https://...
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik
      options:
        - label: Bu bildirime hassas kişisel veri eklemediğimi onaylıyorum.
          required: true
